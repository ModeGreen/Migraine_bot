# Вопросы, которые бот задаёт при записи приступа.
# Можно менять порядок, тексты и варианты — код править не нужно.
# После изменения перезапусти бота: docker compose restart
#
# Поля вопроса:
#   id       — короткий латинский ключ (не меняй его после начала записей, иначе
#              старые ответы потеряют подпись в выгрузке)
#   label    — подпись в выгрузке
#   text     — текст вопроса в чате
#   type     — single (один вариант), multi (несколько), scale (шкала чисел)
#   options  — варианты для single/multi
#   min/max  — границы для scale
#   other    — показывать кнопку «✍️ Другое» (ответ текстом или голосом)
#   columns  — сколько кнопок в ряду
#
# Любой вопрос можно пропустить кнопкой «Пропустить», а вместо нажатия кнопки
# можно просто написать ответ текстом — он сохранится как ответ на вопрос.

questions:
  - id: location
    label: Где болело
    text: "Какая часть головы болела? Можно выбрать несколько, потом нажми «Дальше»."
    type: multi
    options: [Лоб, Виски, Затылок, Темя, Глаза, Левая сторона, Правая сторона, Вся голова]
    other: true
    columns: 2

  - id: period
    label: Месячные
    text: "Шли ли месячные?"
    type: single
    options: [Да, Нет, Скоро начнутся, Только закончились]
    columns: 2

  - id: duration
    label: Длительность
    text: "Как долго болела голова?"
    type: single
    options: [Меньше часа, 1–4 часа, 4–12 часов, 12–24 часа, Больше суток, Ещё болит]
    other: true
    columns: 2

  - id: intensity
    label: Сила боли (1–10)
    text: "Насколько сильной была боль от 1 до 10?"
    type: scale
    min: 1
    max: 10
    columns: 5

  - id: painkillers
    label: Обезболивающее
    text: "Принимала обезболивающее?"
    type: single
    options: [Нет, Да — помогло, Да — помогло частично, Да — не помогло]
    other: true
    columns: 1

# Последний шаг — свободный рассказ: сколько угодно сообщений и голосовых.
final:
  label: Заметки
  text: |-
    Расскажи всё, что кажется важным: какое лекарство и когда приняла, что могло спровоцировать (сон, еда, стресс, погода), другие симптомы — тошнота, свет, звуки, аура.

    Можно написать несколько сообщений или записать голосовые. Когда закончишь — нажми «✅ Готово».
