services:
  migraine-bot:
    build: .
    container_name: migraine-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data                        # база, голосовые, бэкапы, модель Whisper
      - ./questions.yaml:/app/questions.yaml:ro # вопросы можно править без пересборки
      - /etc/localtime:/etc/localtime:ro        # часовой пояс берётся у сервера
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
